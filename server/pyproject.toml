[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-interview-coach"
version = "0.1.0"
description = "Browser-based AI interview practice and coaching application"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "aiosqlite>=0.20,<1",
  "asyncpg>=0.29,<1",
  "certifi>=2025.1.31",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "openai>=2.53,<3",
  "pyjwt[crypto]>=2.10,<3",
  "pypdf>=6.0,<7",
  "pydantic-settings>=2.7,<3",
  "python-docx>=1.2,<2",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.4,<2",
  "pip-audit>=2.10,<3",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
include = ["api*", "domain*", "prompts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
