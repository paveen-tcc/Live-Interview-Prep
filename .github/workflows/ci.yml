name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install -e ".[dev]"
      - run: npm ci && npm run build
        working-directory: web
      - run: python -m ruff format --check api domain evals migrations prompts scripts tests
      - run: python -m ruff check api domain evals migrations prompts scripts tests
      - run: python -m pytest tests
      - name: Audit Python dependencies
        run: python -m pip_audit --progress-spinner=off

  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - run: python -m pip install -r prototype/requirements.txt
      - run: python -m unittest discover -s prototype/tests -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=high

  container:
    runs-on: ubuntu-latest
    needs: [backend, prototype, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ai-interview-coach:${{ github.sha }}
