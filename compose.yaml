services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: interview_coach
      POSTGRES_USER: interview_coach
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interview_coach -d interview_coach"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - interview-coach-postgres:/var/lib/postgresql/data

volumes:
  interview-coach-postgres:
